apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emi-ingress
  namespace: emi
spec:
  ingressClassName: nginx
  rules:
  - host: emi.local
    http:
      paths:
      - backend:
          service:
            name: emi-web
            port:
              number: 80
        path: /
        pathType: Prefix
status:
  loadBalancer: {}
