<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loan EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:850px">
  <h2 class="mb-3">Loan EMI Calculator</h2>

  <form id="emiForm" class="card card-body mb-3">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Loan amount (P)</label>
        <input type="number" id="P" class="form-control" min="1" step="any" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Annual interest rate (%)</label>
        <input type="number" id="rate" class="form-control" min="0.01" step="any" required>
      </div>
      <div class="col-md-4">
        <label class="form-label">Tenure (months)</label>
        <input type="number" id="n" class="form-control" min="1" step="1" required>
      </div>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Calculate</button>
  </form>

  <div id="error" class="alert alert-danger d-none"></div>
  <div id="result" class="alert alert-success d-none"></div>

  <h5 class="mt-4">Last 10 calculations</h5>
  <table class="table table-sm table-striped">
    <thead>
      <tr><th>Time</th><th>Principal</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Served by</th></tr>
    </thead>
    <tbody id="history"></tbody>
  </table>

  <footer class="text-muted small mt-4">DS-584 Cloud Computing - Assignment 4 - v1.1</footer>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  const fmt = x => Number(x).toLocaleString(undefined, { maximumFractionDigits: 2 });

  function loadHistory() {
    $.get('/api/history', function (rows) {
      const $tb = $('#history').empty();
      rows.forEach(r => {
        $('<tr>')
          .append($('<td>').text(new Date(r.createdAt).toLocaleString()))
          .append($('<td>').text(fmt(r.principal)))
          .append($('<td>').text(r.rate))
          .append($('<td>').text(r.months))
          .append($('<td>').text(fmt(r.emi)))
          .append($('<td>').text(r.servedBy))
          .appendTo($tb);
      });
    });
  }

  $('#emiForm').on('submit', function (e) {
    e.preventDefault();
    $('#error').addClass('d-none');
    const P = parseFloat($('#P').val());
    const rate = parseFloat($('#rate').val());
    const n = parseInt($('#n').val(), 10);

    if (!(P > 0 && rate > 0 && n > 0)) {
      $('#error').text('Please enter positive numbers only.').removeClass('d-none');
      return;
    }

    $.ajax({
      type: 'POST', url: '/api/emi',
      contentType: 'application/json',
      data: JSON.stringify({ P: P, rate: rate, n: n }),
      success: function (d) {
        $('#result').removeClass('d-none').html(
          '<b>Monthly EMI:</b> ' + fmt(d.emi) +
          '<br><b>Total payment:</b> ' + fmt(d.totalPayment) +
          '<br><b>Total interest:</b> ' + fmt(d.totalInterest) +
          '<br><small>Served by pod: ' + d.servedBy + ' (' + d.podIP + ')</small>'
        );
        loadHistory();
      },
      error: function (xhr) {
        const msg = (xhr.responseJSON && xhr.responseJSON.error) || 'Request failed';
        $('#error').text(msg).removeClass('d-none');
      }
    });
  });

  loadHistory();
</script>
</body>
</html>
